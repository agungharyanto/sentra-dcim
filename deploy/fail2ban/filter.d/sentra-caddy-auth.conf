# Sentra DCIM — failed basic_auth logins in the Caddy JSON access log (ISS-026, v0.2.5).
#
# Counts ONLY: status 401 + an Authorization header present (wrong credentials) + our public host.
# A 401 without Authorization is the normal browser challenge and is never counted.
#
# Every condition is a lookahead, so the order of JSON keys does not matter. Attacker-controlled header values are
# JSON-escaped by Caddy (\"), so they can never forge `"status":401`, `"Authorization":["REDACTED"]` or `"client_ip":"…"`.
# Caddy always logs the Authorization value as "REDACTED".
#
# From v0.3.1 the app answers 401 itself (failed app login, expired session) while the browser still sends the
# basic_auth header. Those responses come from the app, which always sets X-Request-Id: they are ignored here (the
# app has its own lockout + rate limit; an app-login jail follows in v0.3.4). The match is anchored to
# "resp_headers" — a request header named X-Request-Id cannot hide a basic_auth failure.

[INCLUDES]
before = common.conf

[Init]
# Regex-escaped public host; the installer passes it from DOMAIN in .env (filter = sentra-caddy-auth[sentra_host=…]).
sentra_host = sentra\.example\.go\.id

[Definition]
failregex = ^(?=.*"status":\s*401[,}])(?=.*"Authorization":\s*\[\s*"REDACTED"\s*\])(?=.*"host":\s*"%(sentra_host)s(?::\d+)?")(?=.*"client_ip":\s*"<ADDR>")

ignoreregex = "resp_headers":\s*\{[^{}]*"X-Request-Id":\s*\[

# Caddy writes the Unix timestamp with sub-second precision: "ts":1791905931.6194942
datepattern = "ts":\s*{EPOCH}
