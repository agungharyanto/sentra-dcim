version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations
      - internal/platform/database/schema
    queries: internal/system/repo/queries.sql
    gen:
      go:
        package: repo
        out: internal/system/repo
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
  - engine: postgresql
    schema:
      - migrations
      - internal/platform/database/schema
    queries: internal/auth/repo/queries.sql
    gen:
      go:
        package: repo
        out: internal/auth/repo
        sql_package: pgx/v5
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "inet"
            nullable: true
            go_type:
              import: "net/netip"
              type: "Addr"
              pointer: true
  - engine: postgresql
    schema:
      - migrations
      - internal/platform/database/schema
    queries: internal/audit/repo/queries.sql
    gen:
      go:
        package: repo
        out: internal/audit/repo
        sql_package: pgx/v5
        emit_interface: true
        overrides:
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "inet"
            nullable: true
            go_type:
              import: "net/netip"
              type: "Addr"
              pointer: true
  - engine: postgresql
    schema:
      - migrations
      - internal/platform/database/schema
    queries: internal/users/repo/queries.sql
    gen:
      go:
        package: repo
        out: internal/users/repo
        sql_package: pgx/v5
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "inet"
            nullable: true
            go_type:
              import: "net/netip"
              type: "Addr"
              pointer: true
