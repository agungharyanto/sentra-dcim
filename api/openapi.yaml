openapi: 3.1.0
info:
  title: Sentra DCIM API
  version: 0.4.1
  summary: REST API Sentra DCIM — Diskominfo Provinsi Bali
  description: |
    Semua endpoint berada di bawah `/api/v1`. Waktu dikirim dalam UTC (RFC 3339);
    zona tampilan diatur server lewat `DISPLAY_TIMEZONE` (default `Asia/Jakarta`, WIB, UTC+7).

    Setiap operasi memiliki ekstensi **`x-sentra-access`** yang menyatakan siapa yang dapat memanggilnya lewat domain
    publik: `public` (tanpa login), `login` (perlu sesi aplikasi yang lolos MFA), `internal` (hanya listener internal server; ditolak `403` di edge). Viewer API di Pusat Bantuan
    menampilkan label dari nilai ini.

    **Autentikasi (sejak v0.3.1, ADR-003):** sesi server-side. `POST /api/v1/auth/login` memasang cookie
    `__Host-sentra_session` (HttpOnly, Secure, SameSite=Strict) dan `__Host-sentra_csrf`. Semua endpoint selain
    `health`, `version`, `auth/login` (dan `ready` di listener internal) **default-deny**: tanpa sesi → `401
    unauthenticated`. Metode yang mengubah data (POST/PUT/PATCH/DELETE) wajib membawa header `Origin` dari domain
    aplikasi dan header `X-Sentra-CSRF` yang sama dengan cookie `__Host-sentra_csrf` (sebelum login: nilai apa pun
    yang tidak kosong) → bila tidak, `403 csrf_failed`. Selama akun wajib ganti kata sandi, semua endpoint kecuali
    `auth/me`, `auth/password`, `auth/logout` menjawab `403 password_change_required`.

    **MFA (sejak v0.3.3, wajib untuk semua role):** setelah kata sandi benar sesi berstatus *mfa_pending*
    (`session.mfa_verified=false`): hanya `auth/me`, `auth/logout`, `auth/mfa`, `auth/mfa/enrol`,
    `auth/mfa/enrol/confirm`, `auth/mfa/verify` yang bisa dipakai; endpoint lain → `403 mfa_required`. Akun tanpa
    MFA aktif (`user.mfa_enabled=false`) melakukan enrolment (QR/kode manual + 1 kode), lainnya memasukkan kode TOTP
    (RFC 6238, 6 digit, 30 detik, ±1 langkah, kode yang sudah dipakai ditolak) atau recovery code. Kode salah →
    `401 invalid_mfa_code`, dihitung ke lockout yang sama dengan kata sandi (5 → 15 menit, semua sesi akun dicabut);
    rate limit per IP & per akun → `429`. Urutan: MFA dulu, lalu ganti kata sandi wajib.

    **Otorisasi (sejak v0.3.2, RBAC):** izin didefinisikan di kode, role di database. Operasi yang butuh izin
    memiliki ekstensi **`x-sentra-permission`**; tanpa izin itu jawabannya `403 forbidden` (dicatat di log audit
    sebagai `authz.denied`). Operasi tanpa ekstensi ini terbuka untuk semua pengguna yang masuk. Role sistem: Admin
    (semua izin), NOC, Security, Teknisi, Viewer, Auditor (`users.read`, `roles.read`). Role dibaca ulang setiap
    request, jadi perubahan role berlaku seketika.

    **Scope site (sejak v0.4.1, D-084):** penugasan role bisa global atau **per site**. Penugasan per site hanya memberi
    izin data site (`facility.*`, `rack.*`) untuk site itu. Daftar hanya berisi data dalam scope; detail/ubah objek di
    luar scope menjawab `404` (seperti tidak ada); objek yang bisa dibaca tetapi tidak dikelola → `403 out_of_scope`.

    **Optimistic locking (sejak v0.4.1, D-085):** objek facility membawa `version` dan header `ETag`; PATCH dan arsip
    wajib `If-Match` (`428 precondition_required` bila tidak ada, `412 version_conflict` bila basi).

    Setiap respons menyertakan header `X-Request-Id` untuk penelusuran. Error memakai format `ErrorBody`.
    Rate limit per IP klien (default 20 req/detik, burst 40) — respons `429` menyertakan `Retry-After`.
    Endpoint `GET` juga melayani `HEAD`.

    **Akses publik:** lewat `https://sentra.bajastu.id` hanya `/api/v1/health` dan `/api/v1/version` yang
    diteruskan tanpa autentikasi. `/api/v1/auth/*`, `/api/v1/ui/bootstrap`, `/api/v1/help/*` (dan UI web di `/`)
    tidak lagi dilindungi basic_auth (dicabut v0.3.3, ISS-026): aplikasi sendiri yang mensyaratkan sesi; permintaan API
    lain ditolak proxy dengan `403`. Listener internal server (`127.0.0.1:8080`, hanya dari server itu sendiri) menerapkan aturan sesi
    yang sama. Detail operasional `/api/v1/version` (commit, versi Go, waktu server) hanya dikirim ke sesi dengan
    izin `system.version.read` (Admin), di listener mana pun.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://sentra.bajastu.id
    description: Produksi (publik; hanya health & version)
  - url: http://127.0.0.1:8080
    description: Listener internal di server (API lengkap)
tags:
  - name: system
    description: Status layanan dan informasi build
  - name: ui
    description: Data pendukung UI web (bootstrap, registry menu)
  - name: help
    description: Pusat Bantuan — halaman Markdown (ID/EN) dan spesifikasi OpenAPI untuk viewer read-only
  - name: auth
    description: Masuk/keluar, sesi sendiri, ganti kata sandi (sesi server-side, ADR-003)
  - name: users
    description: Pengguna & Role — akun, penetapan role, nonaktifkan, reset kata sandi (RBAC, v0.3.2)
  - name: audit
    description: Audit log — penelusuran event, ekspor CSV, status & verifikasi hash chain (v0.3.4)
  - name: settings
    description: Pengaturan sistem (grup `regional` sejak v0.3.5) dan preferensi pengguna sendiri
  - name: facility
    description: Hierarki Site > Gedung > Lantai > Ruang (v0.4.1) dan pohon facility
  - name: rack
    description: Rack dengan nama bebas, lokasi, kapasitas, dan status (v0.4.1)
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      x-sentra-access: public
      summary: Liveness — proses berjalan
      description: Tidak memeriksa dependensi. Dipakai healthcheck container dan Caddy.
      security: []
      responses:
        "200":
          description: Proses hidup
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/ready:
    get:
      tags: [system]
      operationId: getReady
      x-sentra-access: internal
      summary: Readiness — dependensi siap
      description: |
        Memeriksa `database`, `redis`, dan `migrations` (versi skema DB sama dengan migrasi di binary).
        Detail error tidak dikirim ke klien (hanya ke log server).
      security: []
      responses:
        "200":
          description: Semua dependensi siap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Satu atau lebih dependensi tidak siap, atau server sedang shutdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      x-sentra-access: public
      summary: Versi aplikasi; detail build untuk Admin
      description: |
        `version` selalu sama dengan `git describe --tags --always --dirty` dari commit yang di-build
        (`make up` me-rebuild image dan memverifikasinya).

        - Tanpa sesi, atau sesi tanpa izin `system.version.read`: hanya `{"version": "..."}` (`PublicVersion`).
        - Sesi dengan izin `system.version.read` (Admin): `Version` lengkap — commit, tanggal build, versi Go, waktu
          server UTC dan zona tampilan. Sama di domain publik dan listener internal (D-054, v0.3.2). Cookie sesi
          yang tidak valid diabaikan (tidak pernah `401`).
      security: []
      responses:
        "200":
          description: Informasi versi (bentuk bergantung izin pemanggil)
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PublicVersion" }
                  - { $ref: "#/components/schemas/Version" }
              examples:
                public:
                  summary: Publik
                  value: { version: v0.1.8 }
                admin:
                  summary: Sesi Admin (system.version.read)
                  value:
                    version: v0.1.8
                    commit: 1a2b3c4
                    build_date: "2026-10-13T08:00:00Z"
                    go_version: go1.27.2
                    server_time_utc: "2026-10-13T08:00:00Z"
                    display_timezone: Asia/Jakarta
                    server_time_display: "2026-10-13T15:00:00+07:00"
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/ui/bootstrap:
    get:
      tags: [ui]
      operationId: getUiBootstrap
      x-sentra-access: login
      summary: Konfigurasi awal UI (bahasa, zona waktu, registry menu)
      description: |
        Dipanggil UI web saat start. `default_locale` dan `timezone` berasal dari konfigurasi server
        (`DEFAULT_LOCALE`, default `id`; `DISPLAY_TIMEZONE`, default `Asia/Jakarta`). Data tetap UTC; zona waktu
        hanya untuk tampilan.

        `menu_groups` (seksi sidebar, terurut `order`) dan `menus` adalah registry menu tunggal (backend). `menus`
        terurut menurut urutan grupnya lalu `order` di dalam grup. **Label tidak dikirim**: UI menerjemahkan
        `menu_groups[].key` lewat `shell:groups.<key>` dan `menus[].key` lewat `shell:sidebar.<key>`.

        **Breaking sejak v0.2.3:** field `menu_groups` dan `menus[].group` baru; path Dasbor `/` → `/dashboard`.

        Perlu sesi yang lolos MFA.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dokumen bootstrap UI
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UiBootstrap" }
              example:
                app_name: Sentra DCIM
                version: v0.3.2
                default_locale: id
                supported_locales: [id, en]
                timezone: Asia/Jakarta
                menu_groups:
                  - { key: monitoring, order: 10 }
                  - { key: system, order: 90 }
                menus:
                  - { key: dashboard, path: /dashboard, icon: layout-dashboard, status: available, group: monitoring, order: 10, permission: "" }
                  - { key: users, path: /users, icon: user-cog, status: available, group: system, order: 15, permission: users.read }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/help/index:
    get:
      tags: [help]
      operationId: getHelpIndex
      x-sentra-access: login
      summary: Daftar halaman Pusat Bantuan (tanpa isi)
      description: |
        Metadata semua halaman untuk satu bahasa, terurut `order` lalu `slug`, termasuk subjudul H2/H3 untuk
        pencarian di klien. Mulai v0.3 disaring menurut role pemanggil berdasarkan `audience` (ISS-032).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelpLocale"
      responses:
        "200":
          description: Indeks halaman
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpIndex" }
        "400": { $ref: "#/components/responses/InvalidLocale" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/HelpUnavailable" }
  /api/v1/help/pages/{slug}:
    get:
      tags: [help]
      operationId: getHelpPage
      x-sentra-access: login
      summary: Satu halaman Pusat Bantuan (Markdown)
      description: |
        `slug` boleh mengandung `/` (mis. `dashboard` atau `dashboard/extra`). Slug hanya dicocokkan dengan daftar
        halaman yang tervalidasi (whitelist), tidak pernah dipakai sebagai path file. Markdown tanpa front matter
        dan tanpa HTML mentah.
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*$", example: dashboard }
        - $ref: "#/components/parameters/HelpLocale"
      responses:
        "200":
          description: Halaman
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpPage" }
        "400": { $ref: "#/components/responses/InvalidLocale" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Halaman tidak ada untuk slug/bahasa ini
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/HelpUnavailable" }
  /api/v1/help/openapi:
    get:
      tags: [help]
      operationId: getHelpOpenAPI
      x-sentra-access: login
      summary: Spesifikasi OpenAPI ini dalam JSON (untuk viewer read-only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dokumen OpenAPI 3.1
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/HelpUnavailable" }
  /api/v1/help/assets/{name}:
    get:
      tags: [help]
      operationId: getHelpAsset
      x-sentra-access: login
      summary: Gambar Pusat Bantuan (PNG/SVG yang di-embed, v0.3.3)
      description: Hanya file dari `docs/help/assets/` (daftar putih; nama tidak pernah menyentuh filesystem).
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*\\.(png|svg)$", example: mfa-phone-scan.svg }
      responses:
        "200":
          description: Gambar
          content:
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/HelpUnavailable" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      x-sentra-access: login
      summary: Masuk dengan nama pengguna (atau NIP) dan kata sandi
      description: |
        Tidak memerlukan sesi. Wajib header
        `Origin` dari domain aplikasi dan `X-Sentra-CSRF` (nilai apa pun yang tidak kosong).

        Berhasil → sesi baru (sesi lama di browser ini dicabut, *rotation*), cookie `__Host-sentra_session`
        (HttpOnly) dan `__Host-sentra_csrf` (dibaca UI untuk header `X-Sentra-CSRF`). Kedua cookie berlaku selama
        browser terbuka; server mengakhiri sesi setelah 30 menit tanpa aktivitas atau 12 jam sejak masuk.

        Gagal → selalu `401 invalid_credentials` yang sama untuk pengguna tidak dikenal, kata sandi salah, akun
        terkunci (5 kali salah → 15 menit) atau nonaktif. Percobaan dibatasi per IP dan per nama pengguna → `429`
        dengan `Retry-After`. Setiap percobaan dicatat di audit log (tanpa kata sandi).
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Berhasil masuk
          headers:
            Set-Cookie:
              description: "`__Host-sentra_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` dan `__Host-sentra_csrf=…; Path=/; Secure; SameSite=Strict`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: Nama pengguna atau kata sandi salah (generik; juga untuk akun terkunci/nonaktif) — `invalid_credentials`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-sentra-access: login
      summary: Keluar — mencabut sesi ini dan menghapus cookie
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Sesi dicabut }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      x-sentra-access: login
      summary: Pengguna yang sedang masuk dan sesi ini
      description: Tetap dapat dipanggil selama akun wajib ganti kata sandi (`user.must_change_password`).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pengguna dan sesi aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      x-sentra-access: login
      summary: Ganti kata sandi sendiri
      description: |
        Kata sandi baru 12–128 karakter (tanpa aturan komposisi), berbeda dari yang sekarang. Berhasil → semua sesi
        lain akun ini dicabut, sesi ini tetap aktif, dan `must_change_password` dihapus.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: "Kata sandi diganti; sesi lain dicabut" }
        "400":
          description: Kata sandi saat ini salah (`invalid_current_password`) atau body tidak valid (`invalid_request`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: |
            Kata sandi baru tidak memenuhi ketentuan (`password_policy`), atau sama dengan salah satu kata sandi terakhir
            (`password_reused`, `password.history` termasuk yang sekarang; v0.3.7)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PasswordPolicyError" }
                  - { $ref: "#/components/schemas/ErrorBody" }
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      x-sentra-access: login
      summary: Sesi aktif milik sendiri
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Daftar sesi aktif (terbaru dulu); `current` menandai sesi ini
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      x-sentra-access: login
      summary: Cabut salah satu sesi sendiri
      description: Hanya sesi milik pengguna sendiri; ID sesi pengguna lain dijawab `404` (tidak membocorkan keberadaannya).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: "Sesi dicabut (bila sesi ini, cookie juga dihapus)" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      x-sentra-access: login
      x-sentra-permission: users.read
      summary: Daftar pengguna (cari, filter, halaman)
      description: Urut nama pengguna. `q` dicari literal (tanpa wildcard) di nama pengguna dan nama tampilan.
      security:
        - sessionCookie: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: role, in: query, schema: { type: string, example: admin } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Satu halaman pengguna dan jumlah total yang cocok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [users]
      operationId: createUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Buat pengguna dengan kata sandi sementara
      description: |
        Server membuat kata sandi sementara acak (`xxxx-xxxx-xxxx-xxxx`) yang dikirim **sekali** di respons ini
        (`Cache-Control: no-store`), tidak pernah dicatat. Pengguna wajib menggantinya saat login pertama.
        Nama pengguna tidak bisa diubah setelah dibuat.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Pengguna dibuat
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithPassword" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      x-sentra-access: login
      x-sentra-permission: users.read
      summary: Detail pengguna
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pengguna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Ubah nama tampilan dan/atau e-mail
      description: Field yang tidak dikirim tidak berubah; `email` kosong menghapus e-mail.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: setUserRoles
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Ganti seluruh role pengguna
      description: |
        Minimal satu role (boleh kosong bila pengguna punya role per-site). Berlaku seketika. Ditolak `409 self_action` bila mencabut role Admin sendiri, `409
        last_admin` bila mencabut role Admin dari Admin aktif terakhir.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoles" }
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: disableUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Nonaktifkan pengguna (semua sesinya dicabut)
      description: Idempoten. Ditolak `409 self_action` untuk akun sendiri dan `409 last_admin` untuk Admin aktif terakhir.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: enableUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Aktifkan kembali pengguna
      description: Idempoten. Kata sandi tidak berubah.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: resetUserPassword
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Atur ulang kata sandi (kata sandi sementara baru)
      description: |
        Kata sandi sementara baru dikirim **sekali** (`Cache-Control: no-store`), wajib diganti saat login, lockout
        dibuka, semua sesi pengguna dicabut. Tidak untuk akun sendiri (`409 self_action`; pakai `auth/password`).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Kata sandi sementara
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPassword" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/mfa:
    get:
      tags: [auth]
      operationId: getMfaStatus
      x-sentra-access: login
      summary: Status MFA akun sendiri
      description: Dapat dipanggil saat sesi *mfa_pending*.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Status MFA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/mfa/enrol:
    post:
      tags: [auth]
      operationId: startMfaEnrolment
      x-sentra-access: login
      summary: Mulai enrolment MFA (secret baru, QR, kode manual)
      description: |
        Hanya untuk akun tanpa MFA aktif. Memanggil ulang mengganti secret yang belum dikonfirmasi. Respons memuat
        secret satu kali (`Cache-Control: no-store`); jangan disimpan klien.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Data enrolment
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrolment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
  /api/v1/auth/mfa/enrol/confirm:
    post:
      tags: [auth]
      operationId: confirmMfaEnrolment
      x-sentra-access: login
      summary: Aktifkan MFA dengan kode pertama; sesi ini lolos MFA
      description: "Mengembalikan 10 recovery code sekali pakai — **sekali saja** (`Cache-Control: no-store`)."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: MFA aktif
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidMfaCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      x-sentra-access: login
      summary: Selesaikan login dengan kode TOTP atau recovery code
      description: Recovery code (`xxxxx-xxxxx`, huruf besar/kecil & spasi diabaikan) hanya berlaku sekali.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "204": { description: Sesi lolos MFA }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidMfaCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/mfa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      x-sentra-access: login
      summary: Buat ulang 10 recovery code (kode lama tidak berlaku)
      description: Butuh kode TOTP saat ini (autentikasi ulang). Kode baru tampil sekali.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: Recovery code baru
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/InvalidMfaCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/users/{id}/mfa-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: resetUserMfa
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Reset MFA pengguna lain (enrol ulang saat login berikutnya)
      description: "Menghapus MFA & recovery code dan mencabut semua sesi pengguna. Tidak untuk akun sendiri (`409 self_action`)."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: MFA direset }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/roles:
    get:
      tags: [users]
      operationId: listRoles
      x-sentra-access: login
      x-sentra-permission: roles.read
      summary: Daftar role, izinnya, dan jumlah pengguna
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Role sistem (urutan tampilan) dan semua izin yang dikenal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit/events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      x-sentra-access: login
      x-sentra-permission: audit.read
      summary: Daftar event audit (filter, keyset pagination)
      description: |
        Terbaru dulu (urut `seq` = posisi di hash chain). Halaman berikutnya (lebih lama): kirim `next_before` sebagai
        `before`. Waktu dalam UTC; UI menampilkannya dalam zona waktu tampilan (WIB). Filter kosong diabaikan;
        `actor` dicari literal (tanpa wildcard) di nama pengguna pelaku; `action` cocok persis atau sebagai awalan
        bertitik (`auth` → `auth.*`). Metadata tidak pernah memuat kata sandi, token, atau kode MFA.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AuditSince"
        - $ref: "#/components/parameters/AuditUntil"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditResult"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditTargetId"
        - $ref: "#/components/parameters/AuditBefore"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Satu halaman event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/audit/events/export.csv:
    get:
      tags: [audit]
      operationId: exportAuditEvents
      x-sentra-access: login
      x-sentra-permission: audit.export
      summary: Ekspor CSV event audit (filter sama dengan daftar)
      description: |
        Maksimal 50.000 baris per ekspor (terbaru dulu). Kolom: `seq, occurred_at_utc, occurred_at_local, actor_type,
        actor_username, actor_id, action, result, target_type, target_id, ip, user_agent, request_id, metadata, hash`.
        **Injeksi formula dinetralkan**: sel yang diawali `=`, `+`, `-`, `@` (atau tab/CR) diberi awalan `'` agar
        spreadsheet menampilkannya sebagai teks. Ekspor itu sendiri dicatat sebagai event `audit.export` (jumlah
        baris, filter, terpotong atau tidak).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AuditSince"
        - $ref: "#/components/parameters/AuditUntil"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditResult"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditTargetId"
        - $ref: "#/components/parameters/AuditBefore"
      responses:
        "200":
          description: "File CSV (UTF-8, `Content-Disposition: attachment`, `Cache-Control: no-store`)"
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/audit/actions:
    get:
      tags: [audit]
      operationId: listAuditActions
      x-sentra-access: login
      x-sentra-permission: audit.read
      summary: Nama aksi yang ada di audit log (untuk pilihan filter)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Daftar aksi unik, urut abjad
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions: { type: array, items: { type: string, example: auth.login.success } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit/integrity:
    get:
      tags: [audit]
      operationId: getAuditIntegrity
      x-sentra-access: login
      x-sentra-permission: audit.read
      summary: Status verifikasi hash chain terakhir
      description: |
        Hasil verifikasi terakhir sejak aplikasi berjalan (job harian atau manual); `last` null bila belum ada.
        Verifikasi terhadap anchor di backup dijalankan operator (`make audit-verify`), bukan lewat API.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Status integritas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditIntegrity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit/integrity/verify:
    post:
      tags: [audit]
      operationId: verifyAuditIntegrity
      x-sentra-access: login
      x-sentra-permission: audit.read
      summary: Verifikasi hash chain sekarang
      description: |
        Menghitung ulang seluruh chain sejak checkpoint terakhir. Hanya satu verifikasi berjalan pada satu waktu
        (`409 verification_running`). Dicatat sebagai event `audit.verify`; chain rusak juga dicatat di log level
        error.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Hasil verifikasi (`ok` false bila chain rusak — `broken_seq` dan `reason` menyebut lokasinya)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerifyResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Verifikasi lain sedang berjalan (`verification_running`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
  /api/v1/settings/{group}:
    parameters:
      - { name: group, in: path, required: true, schema: { type: string, example: regional } }
    get:
      tags: [settings]
      operationId: getSettings
      x-sentra-access: login
      x-sentra-permission: settings.manage
      summary: Baca satu grup pengaturan beserta skemanya
      description: |
        Grup `regional` (v0.3.5): `language`, `timezone`, `time_format`, `date_format`. Grup `session` (v0.3.7):
        `idle_minutes` (5–240, default 30), `absolute_hours` (1–24, default 12; idle tidak boleh melebihi absolut).
        Grup `password` (v0.3.7): `expiry_days` (0 = tidak kedaluwarsa, atau 30–365; default 90; akun Viewer saja
        dikecualikan), `warn_days` (1–60, default 14, kurang dari expiry), `history` (1–24, default 5). Grup
        `allowlist` hanya-baca di sini (diubah lewat `/settings/allowed-ips`).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Nilai dan skema per key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsGroup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [settings]
      operationId: updateSettings
      x-sentra-access: login
      x-sentra-permission: settings.manage
      summary: Ubah pengaturan (sebagian); `null` = kembali ke default
      description: |
        Divalidasi menurut skema per key (tipe, pilihan, batas min/maks; zona waktu harus nama IANA yang dikenal).
        Satu nilai tidak valid → tidak ada yang ditulis (`422`, `error.field`). Setiap perubahan nyata dicatat
        sebagai event audit `settings.update` (`target_id` = key, metadata `old`/`new`).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Grup setelah perubahan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsGroup" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/preferences:
    get:
      tags: [settings]
      operationId: getPreferences
      x-sentra-access: login
      summary: Preferensi regional sendiri, nilai efektif, dan nilai sistem
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Preferensi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [settings]
      operationId: updatePreferences
      x-sentra-access: login
      summary: Ubah preferensi sendiri; `null` = ikuti sistem
      description: |
        Key lengkap (`regional.language`, `regional.timezone`, `regional.time_format`, `regional.date_format`),
        divalidasi seperti pengaturan sistem. Setiap perubahan dicatat sebagai `user.preferences.update`
        (metadata `key`, `old`, `new`).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Preferensi setelah perubahan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/settings/allowed-ips:
    get:
      tags: [settings]
      operationId: getAllowedIps
      x-sentra-access: login
      x-sentra-permission: settings.manage
      summary: Allowed IP — mode, daftar jaringan, dan IP Anda saat ini
      description: |
        Hanya panel web (v0.3.6, D-078). Mode `off` (tidak menyaring), `monitor` (IP di luar daftar dicatat di audit
        sebagai `security.allowlist_outside`, tidak diblok), `enforce` (di luar daftar → `403 ip_not_allowed`,
        `security.allowlist_blocked`). `always_public` selalu terbuka (pemantauan & perpanjangan TLS). IP klien
        adalah alamat koneksi langsung yang dilihat proxy; header `X-Forwarded-For` dari klien tidak dipercaya.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Status Allowed IP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [settings]
      operationId: addAllowedIp
      x-sentra-access: login
      x-sentra-permission: settings.manage
      summary: Tambah IP atau jaringan (CIDR)
      description: |
        IPv4/IPv6; satu alamat disimpan sebagai /32 atau /128; bit host harus nol (`10.0.0.0/24`, bukan
        `10.0.0.5/24`); tidak lebih luas dari /8 (IPv4) atau /16 (IPv6); tanpa zona (`%eth0`). Duplikat → `409
        duplicate_network`. Dicatat `allowlist.add`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              additionalProperties: false
              properties:
                cidr: { type: string, example: 192.0.2.0/24 }
                label: { type: string, maxLength: 100, example: Ruang NOC }
      responses:
        "201":
