name: CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.2"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: ShellCheck
        run: shellcheck -x ops/*.sh ops/harden/*.sh scripts/*.sh scripts/hooks/pre-commit test/api/*.sh test/e2e/*.sh
      - name: Caddyfile validation (production-like and empty env)
        run: make caddy-validate
      - name: OpenAPI lint
        run: docker run --rm -v "$PWD/api:/spec:ro" redocly/cli:2.62.1 lint /spec/openapi.yaml
      - name: sqlc generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc diff

  test:
    name: Unit & integration tests
    runs-on: ubuntu-24.04
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_DB: sentra
          POSTGRES_USER: sentra
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentra -d sentra"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # Redis runs with requirepass like production; service containers cannot override the command.
      - name: Start Redis (password protected)
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 redis:8.10.2-alpine \
            redis-server --requirepass ci-only-redis-password
          for _ in $(seq 1 30); do
            docker exec redis redis-cli -a ci-only-redis-password --no-auth-warning ping | grep -q PONG && exit 0
            sleep 1
          done
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests (race + coverage)
        run: CGO_ENABLED=1 go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Integration tests
        env:
          SENTRA_IT_DATABASE_URL: postgres://sentra:ci-only-password@127.0.0.1:5432/sentra?sslmode=disable
          SENTRA_IT_REDIS_ADDR: 127.0.0.1:6379
          SENTRA_IT_REDIS_PASSWORD: ci-only-redis-password
        run: go test -count=1 -tags=integration ./test/integration/...

  web:
    name: Web UI (lint, typecheck, i18n, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: make web-check (Docker, no Node on the runner)
        run: make web-check

  build:
    name: Build image & API smoke test
    runs-on: ubuntu-24.04
    needs: [lint, test, gitleaks, web]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sentra-app:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image runs as non-root
        run: test "$(docker image inspect -f '{{.Config.User}}' sentra-app:ci)" = "65532:65532"
      - name: Start stack and run API smoke test
        run: |
          gen() { openssl rand -hex 16; }
          sed -e "s/^POSTGRES_PASSWORD=CHANGE_ME/POSTGRES_PASSWORD=$(gen)/" \
              -e "s/^REDIS_PASSWORD=CHANGE_ME/REDIS_PASSWORD=$(gen)/" \
              -e "s/^DOMAIN=.*/DOMAIN=/" -e "s/^ACME_EMAIL=.*/ACME_EMAIL=/" \
              -e "s/^CADDY_PUBLIC_HTTP_BIND=.*/CADDY_PUBLIC_HTTP_BIND=127.0.0.1:80/" \
              -e "s/^CADDY_PUBLIC_HTTPS_BIND=.*/CADDY_PUBLIC_HTTPS_BIND=127.0.0.1:443/" .env.example > .env
          # Throwaway basic_auth for the UI tests (ISS-026); generated per run, never stored.
          web_pass="$(gen)"
          web_hash="$(docker run --rm caddy:2.11.7-alpine caddy hash-password --plaintext "$web_pass")"
          sed -i -e "s/^WEB_BASIC_AUTH_USER=.*/WEB_BASIC_AUTH_USER=ci/" \
                 -e "s|^WEB_BASIC_AUTH_HASH=.*|WEB_BASIC_AUTH_HASH='${web_hash}'|" .env
          echo "::add-mask::$web_pass"
          echo "SENTRA_WEB_USER=ci" >> "$GITHUB_ENV"
          echo "SENTRA_WEB_PASS=$web_pass" >> "$GITHUB_ENV"
          make up
          make test-api
      - name: UI edge test (basic_auth, SPA, headers, bootstrap)
        run: BASE_URL=https://localhost ./test/api/ui.sh
      - name: Browser tests (Playwright + axe, design system screenshots)
        run: BASE_URL=https://localhost ./test/e2e/run.sh
      - name: Upload design system screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-system-screenshots
          path: test/e2e/artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
