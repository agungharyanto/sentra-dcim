# Sentra DCIM (v0.2.9) — show the GRUB menu for 10 s so an older kernel can be chosen from the OCI serial console
# (docs/ops/runbooks/kernel-rollback.md). Loaded after 50-cloudimg-settings.cfg, which hides the menu (timeout 0).
# Terminal stays "console": on OCI Arm/UEFI the EFI console is what the serial console shows. Installed by
# `make boot-menu`.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=10
GRUB_RECORDFAIL_TIMEOUT=10
GRUB_TERMINAL=console
