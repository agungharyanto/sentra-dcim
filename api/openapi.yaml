        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
components:
  parameters:
    AuditSince:
      { name: since, in: query, description: "Waktu mulai (inklusif), RFC 3339", schema: { type: string, format: date-time } }
    AuditUntil:
      { name: until, in: query, description: "Waktu akhir (eksklusif), RFC 3339", schema: { type: string, format: date-time } }
    AuditActor:
      { name: actor, in: query, description: Bagian nama pengguna pelaku (literal), schema: { type: string, maxLength: 128 } }
    AuditAction:
      { name: action, in: query, description: Aksi atau awalannya, schema: { type: string, pattern: "^[a-z][a-z0-9_.]{0,63}$", example: auth.login } }
    AuditResult:
      { name: result, in: query, schema: { type: string, enum: [success, failure, denied] } }
    AuditTargetType:
      { name: target_type, in: query, schema: { type: string, maxLength: 64, example: user } }
    AuditTargetId:
      { name: target_id, in: query, schema: { type: string, maxLength: 128 } }
    AuditBefore:
      { name: before, in: query, description: "Kursor: hanya event dengan `seq` lebih kecil (nilai `next_before`)", schema: { type: integer, format: int64, minimum: 1 } }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    HelpLocale:
      name: locale
      in: query
      required: false
      description: Bahasa halaman; default `DEFAULT_LOCALE` server
      schema: { type: string, enum: [id, en] }
    CsrfHeader:
      name: X-Sentra-CSRF
      in: header
      required: true
      description: Token CSRF = nilai cookie `__Host-sentra_csrf` (sebelum login nilai apa pun yang tidak kosong)
      schema: { type: string }
    SiteId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    BuildingId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    FloorId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RoomId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RackId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: '`ETag` terakhir yang dilihat (mis. `"3"`); wajib untuk PATCH dan arsip (D-085)'
      schema: { type: string, example: '"3"' }
    Q: { name: q, in: query, description: Cari (nama/kode; rack juga asset tag & label baris), schema: { type: string, maxLength: 100 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    IncludeArchived: { name: include_archived, in: query, schema: { type: boolean, default: false } }
    SiteFilter: { name: site_id, in: query, schema: { type: string, format: uuid } }
    BuildingFilter: { name: building_id, in: query, schema: { type: string, format: uuid } }
    FloorFilter: { name: floor_id, in: query, schema: { type: string, format: uuid } }
    RoomFilter: { name: room_id, in: query, schema: { type: string, format: uuid } }
    SiteStatus: { name: status, in: query, schema: { type: string, enum: [planned, active, inactive] } }
    RoomTypeFilter: { name: room_type, in: query, schema: { $ref: "#/components/schemas/RoomType" } }
    RackStatusFilter: { name: status, in: query, schema: { $ref: "#/components/schemas/RackStatus" } }
    SiteSort: { name: sort, in: query, description: Default kode, schema: { type: string, enum: [code, -code, name, -name, updated_at, -updated_at] } }
    BuildingSort: { name: sort, in: query, description: Default site lalu nama, schema: { type: string, enum: [name, -name, updated_at, -updated_at] } }
    FloorSort: { name: sort, in: query, description: Default gedung lalu level, schema: { type: string, enum: [level, -level, name, -name] } }
    RoomSort: { name: sort, in: query, description: Default lokasi lalu nama, schema: { type: string, enum: [name, -name, room_type] } }
    RackSort: { name: sort, in: query, description: "Default lokasi, baris, posisi, nama", schema: { type: string, enum: [name, -name, status, -status, updated_at, -updated_at] } }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sentra_session
      description: |
        Sesi server-side (token acak 256-bit; server hanya menyimpan SHA-256-nya). Dipasang oleh `POST /api/v1/auth/login`.
        Idle 30 menit, absolut 12 jam. Metode yang mengubah data juga butuh `Origin` + `X-Sentra-CSRF`.
        Lewat domain publik tidak ada lagi basic_auth (dicabut v0.3.3); login & kode MFA yang gagal dihitung jail
        fail2ban per IP (D-066).
  headers:
    ETag:
      description: Versi objek untuk optimistic locking (D-085), mis. `"3"`; kirim kembali di `If-Match`
      schema: { type: string }
    X-Request-Id:
      description: ID unik request untuk penelusuran log
      schema: { type: string }
  responses:
    Unauthenticated:
      description: |
        Tanpa sesi yang valid (`unauthenticated`): cookie tidak ada, sesi kedaluwarsa (idle/absolut), dicabut, atau
        akun dinonaktifkan.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: |
        `csrf_failed` (Origin bukan domain aplikasi / header `X-Sentra-CSRF` tidak ada atau tidak cocok),
        `password_change_required` (akun wajib ganti kata sandi dulu), `mfa_required` (sesi belum lolos MFA), atau `forbidden` (tanpa izin yang
        disyaratkan `x-sentra-permission`, atau ditolak proxy).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Data tidak ditemukan (`not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: |
        `username_taken` (nama pengguna sudah ada, tidak peka huruf besar/kecil), `self_action` (aksi tidak boleh
        pada akun sendiri), `last_admin` (Admin aktif terakhir tidak boleh kehilangan akses), `kiosk_requires_viewer`
        (kiosk hanya untuk akun Viewer saja; matikan kiosk sebelum mengubah role), `kiosk_requires_allowlist`, atau
        `no_roles` (akun harus punya minimal satu role, global atau per-site)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    InvalidMfaCode:
      description: Kode MFA atau recovery code salah, sudah dipakai, atau akun terkunci (`invalid_mfa_code`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    MfaConflict:
      description: "`mfa_already_enabled` (enrolment saat MFA sudah aktif) atau `mfa_not_enrolled` (belum ada MFA)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ValidationFailed:
      description: Input tidak valid (`validation_failed`); `error.field` menyebut field-nya
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    InvalidRequest:
      description: Body JSON tidak valid atau berisi field tak dikenal (`invalid_request`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    AuthUnavailable:
      description: Layanan login sementara tidak tersedia, mis. Redis rate limiter mati — gagal tertutup (`auth_unavailable`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    AllowlistConflict:
      description: |
        `duplicate_network` (jaringan sudah ada), `lockout_risk` (IP Anda tidak akan diizinkan lagi), atau
        `no_pending_change` (tidak ada perubahan enforce yang menunggu konfirmasi)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    InvalidLocale:
      description: Parameter `locale` tidak didukung (`invalid_locale`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    HelpUnavailable:
      description: Konten Pusat Bantuan gagal validasi saat startup; hanya modul help yang nonaktif (`help_unavailable`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    TooManyRequests:
      description: Rate limit terlampaui
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FacilityForbidden:
      description: |
        `forbidden` (tanpa izin), `out_of_scope` (site hanya bisa dibaca, tidak dikelola), `global_scope_required`
        (membuat/mengarsipkan site hanya untuk pengelola global), atau penolakan CSRF/sesi seperti `Forbidden`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FacilityConflict:
      description: |
        `duplicate_name` / `duplicate_code` / `duplicate_asset_tag` (sudah dipakai; `error.field`),
        `has_active_children` (arsipkan anaknya dulu), atau `archived` (data sudah diarsipkan).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FacilityInvalid:
      description: |
        `validation_failed` (`error.field`), `parent_archived` (induk sudah diarsipkan), atau `cross_site_move`
        (rack tidak bisa dipindah ke site lain).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    VersionConflict:
      description: "`version_conflict`: data sudah diubah pengguna lain (If-Match tidak cocok) — muat ulang lalu ulangi"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    PreconditionRequired:
      description: "`precondition_required`: header If-Match (ETag terakhir) wajib"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    RoomType: { type: string, enum: [whitespace, mmr, power, cooling, noc, storage, staging, other] }
    RackStatus: { type: string, enum: [planned, active, reserved, decommissioning, retired] }
    Site:
      type: object
      required: [id, code, name, address, status, version, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,15}$", example: DPS1 }
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [planned, active, inactive] }
        version: { type: integer, minimum: 1, description: Versi optimistic lock (= ETag) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: Terisi bila diarsipkan }
    SiteList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Site" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    SiteCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, maxLength: 16, description: "A–Z, 0–9, _ dan -; huruf kecil diubah ke kapital; tidak bisa diubah setelah dibuat" }
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        address: { type: string, maxLength: 500 }
        status: { type: string, enum: [planned, active, inactive], default: active }
    SitePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        address: { type: string, maxLength: 500 }
        status: { type: string, enum: [planned, active, inactive] }
    Building:
      type: object
      required: [id, site_id, site_code, site_name, code, name, notes, version, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        site_name: { type: string }
        code: { type: string, description: Opsional (string kosong) }
        name: { type: string }
        notes: { type: string }
        version: { type: integer, minimum: 1, description: Versi optimistic lock (= ETag) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: Terisi bila diarsipkan }
    BuildingList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Building" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    BuildingCreate:
      type: object
      additionalProperties: false
      required: [site_id, name]
      properties:
        site_id: { type: string, format: uuid }
        code: { type: string, maxLength: 16 }
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        notes: { type: string, maxLength: 2000 }
    BuildingPatch:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 16 }
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        notes: { type: string, maxLength: 2000 }
    Floor:
      type: object
      required: [id, building_id, building_name, site_id, site_code, name, level, notes, version, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        building_name: { type: string }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        name: { type: string }
        level: { type: integer, minimum: -20, maximum: 200, description: "Urutan lantai (0 = dasar, negatif = basement)" }
        notes: { type: string }
        version: { type: integer, minimum: 1, description: Versi optimistic lock (= ETag) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: Terisi bila diarsipkan }
    FloorList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Floor" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    FloorCreate:
      type: object
      additionalProperties: false
      required: [building_id, name]
      properties:
        building_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        level: { type: integer, minimum: -20, maximum: 200, default: 0 }
        notes: { type: string, maxLength: 2000 }
    FloorPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        level: { type: integer, minimum: -20, maximum: 200 }
        notes: { type: string, maxLength: 2000 }
    Room:
      type: object
      required: [id, floor_id, floor_name, building_id, building_name, site_id, site_code, name, room_type, notes, rack_count, version, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        floor_id: { type: string, format: uuid }
        floor_name: { type: string }
        building_id: { type: string, format: uuid }
        building_name: { type: string }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        name: { type: string }
        room_type: { $ref: "#/components/schemas/RoomType" }
        notes: { type: string }
        rack_count: { type: integer, description: Rack aktif di ruang ini }
        version: { type: integer, minimum: 1, description: Versi optimistic lock (= ETag) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: Terisi bila diarsipkan }
    RoomList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Room" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    RoomCreate:
      type: object
      additionalProperties: false
      required: [floor_id, name]
      properties:
        floor_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        room_type: { $ref: "#/components/schemas/RoomType" }
        notes: { type: string, maxLength: 2000 }
    RoomPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "Spasi di tepi dipangkas; unik per induk (tanpa membedakan huruf besar/kecil) di antara yang aktif" }
        room_type: { $ref: "#/components/schemas/RoomType" }
        notes: { type: string, maxLength: 2000 }
    Rack:
      type: object
      required: [id, room_id, room_name, room_type, floor_id, floor_name, building_id, building_name, site_id, site_code, site_name, name, asset_tag, row_label, row_position, u_height, starting_unit, desc_units, width_in, depth_mm, max_weight_kg, max_power_kw, status, notes, version, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        room_name: { type: string }
        room_type: { $ref: "#/components/schemas/RoomType" }
        floor_id: { type: string, format: uuid }
        floor_name: { type: string }
        building_id: { type: string, format: uuid }
        building_name: { type: string }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        site_name: { type: string }
        name: { type: string, example: "R-A01" }
        asset_tag: { type: [string, "null"] }
        row_label: { type: string }
        row_position: { type: [integer, "null"] }
        u_height: { type: integer, minimum: 1, maximum: 60 }
        starting_unit: { type: integer, minimum: 1, maximum: 100 }
        desc_units: { type: boolean, description: Nomor U menurun dari atas }
        width_in: { type: integer, enum: [19, 23] }
        depth_mm: { type: [integer, "null"] }
        max_weight_kg: { type: [number, "null"] }
        max_power_kw: { type: [number, "null"] }
        status: { $ref: "#/components/schemas/RackStatus" }
        notes: { type: string }
        version: { type: integer, minimum: 1, description: Versi optimistic lock (= ETag) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: Terisi bila diarsipkan }
    RackList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Rack" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    RackCreate:
      type: object
      additionalProperties: false
      required: [room_id, name]
      properties:
        room_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 64, pattern: "^[ ]*[A-Za-z0-9][A-Za-z0-9 ._/-]{0,63}$" }
        asset_tag: { type: [string, "null"], maxLength: 64 }
        row_label: { type: string, maxLength: 16 }
        row_position: { type: [integer, "null"], minimum: 1, maximum: 999 }
        u_height: { type: integer, minimum: 1, maximum: 60, default: 42 }
        starting_unit: { type: integer, minimum: 1, maximum: 100, default: 1 }
        desc_units: { type: boolean, default: false }
        width_in: { type: integer, enum: [19, 23], default: 19 }
        depth_mm: { type: [integer, "null"], minimum: 100, maximum: 2000 }
        max_weight_kg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 999999.99 }
        max_power_kw: { type: [number, "null"], exclusiveMinimum: 0, maximum: 9999.99 }
        status: { $ref: "#/components/schemas/RackStatus" }
        notes: { type: string, maxLength: 2000 }
    RackPatch:
      type: object
      additionalProperties: false
      description: Field yang tidak dikirim tidak berubah; `null` mengosongkan field opsional.
      properties:
        room_id: { type: string, format: uuid, description: Pindah ke ruang lain dalam site yang sama }
        name: { type: string, minLength: 1, maxLength: 64 }
        asset_tag: { type: [string, "null"], maxLength: 64 }
        row_label: { type: string, maxLength: 16 }
        row_position: { type: [integer, "null"], minimum: 1, maximum: 999 }
        u_height: { type: integer, minimum: 1, maximum: 60 }
        starting_unit: { type: integer, minimum: 1, maximum: 100 }
        desc_units: { type: boolean }
        width_in: { type: integer, enum: [19, 23] }
        depth_mm: { type: [integer, "null"], minimum: 100, maximum: 2000 }
        max_weight_kg: { type: [number, "null"] }
        max_power_kw: { type: [number, "null"] }
        status: { $ref: "#/components/schemas/RackStatus" }
        notes: { type: string, maxLength: 2000 }
    FacilityTree:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [id, code, name, status, rack_count, buildings]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              status: { type: string }
              rack_count: { type: integer }
              buildings:
                type: array
                items:
                  type: object
                  required: [id, code, name, rack_count, floors]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    name: { type: string }
                    rack_count: { type: integer }
                    floors:
                      type: array
                      items:
                        type: object
                        required: [id, name, level, rack_count, rooms]
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          level: { type: integer }
                          rack_count: { type: integer }
                          rooms:
                            type: array
                            items:
                              type: object
                              required: [id, name, room_type, rack_count, racks_by_status, racks]
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                room_type: { $ref: "#/components/schemas/RoomType" }
                                rack_count: { type: integer }
                                racks_by_status: { type: object, additionalProperties: { type: integer } }
                                racks:
                                  type: array
                                  items:
                                    type: object
                                    required: [id, name, status]
                                    properties:
                                      id: { type: string, format: uuid }
                                      name: { type: string }
                                      status: { $ref: "#/components/schemas/RackStatus" }
    SiteRole:
      type: object
      required: [role, site_id, site_code, site_name, site_archived]
      properties:
        role: { type: string, example: technician }
        site_id: { type: string, format: uuid }
        site_code: { type: string }
        site_name: { type: string }
        site_archived: { type: boolean }
    UserSiteRoles:
      type: object
      additionalProperties: false
      required: [site_roles]
      properties:
        site_roles:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [role, site_id]
            properties:
              role: { type: string, description: Role sistem selain admin }
              site_id: { type: string, format: uuid }
    AuditEvent:
      type: object
      required: [seq, occurred_at, actor_type, actor_id, actor_username, action, target_type, target_id, result, ip, user_agent, request_id, metadata, hash]
      properties:
        seq: { type: integer, format: int64, description: Posisi di hash chain }
        occurred_at: { type: string, format: date-time, description: UTC }
        actor_type: { type: string, enum: [user, system, anonymous] }
        actor_id: { type: [string, "null"], format: uuid }
        actor_username: { type: string }
        action: { type: string, example: user.create }
        target_type: { type: string }
        target_id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        ip: { type: string, description: Kosong bila tidak diketahui }
        user_agent: { type: string }
        request_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        hash: { type: string, description: "SHA-256 (hex) baris ini = sha256(prev_hash ‖ bentuk kanonik)" }
    AuditEventList:
      type: object
      required: [events, next_before, limit]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_before: { type: [integer, "null"], format: int64, description: "null pada halaman terakhir" }
        limit: { type: integer }
    AuditVerifyResult:
      type: object
      required: [ok, checked, from_seq, head_seq, head_hash, checkpoint_seq, anchors_checked, broken_seq, verified_at]
      properties:
        ok: { type: boolean }
        checked: { type: integer, format: int64, description: Jumlah baris yang dihitung ulang }
        from_seq: { type: integer, format: int64 }
        head_seq: { type: integer, format: int64 }
        head_hash: { type: string }
        checkpoint_seq: { type: integer, format: int64, description: "Batas pemangkasan terakhir (0 = belum pernah)" }
        anchors_checked: { type: integer }
        broken_seq: { type: integer, format: int64, description: "Baris pertama yang rusak (0 = tidak ada)" }
        reason: { type: string, description: Penyebab (tanpa isi baris) }
        verified_at: { type: string, format: date-time }
    AuditIntegrity:
      type: object
      required: [last, running]
      properties:
        last:
          oneOf: [{ $ref: "#/components/schemas/AuditVerifyResult" }, { type: "null" }]
        running: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9._-]{3,64}$", description: Nama pengguna atau NIP (tidak peka huruf besar/kecil) }
        password: { type: string, format: password, minLength: 1 }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12, maxLength: 128, description: "12–128 karakter Unicode, tanpa aturan komposisi" }
    PasswordPolicyError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, min_length, max_length]
          properties:
            code: { type: string, enum: [password_policy] }
            message: { type: string }
            min_length: { type: integer, example: 12 }
            max_length: { type: integer, example: 128 }
    AuthUser:
      type: object
      required: [id, username, display_name, must_change_password, roles, permissions, mfa_enabled]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        must_change_password: { type: boolean, description: "Bila true, hanya auth/me, auth/password, auth/logout yang dapat dipakai" }
        roles: { type: array, items: { type: string }, example: [admin] }
        permissions:
          type: array
          items: { type: string }
          description: Gabungan izin semua role, global dan per-site (UI menyembunyikan menu tanpa izin; API tetap memeriksa)
          example: [roles.read, system.version.read, users.manage, users.read]
        global_permissions:
          type: array
          items: { type: string }
          description: Izin dari role global saja (v0.4.1); mis. membuat site butuh `facility.manage` global
        mfa_enabled: { type: boolean, description: "MFA aktif; false → enrolment saat login" }
        kiosk: { type: boolean, description: "Akun monitoring/kiosk (v0.3.7): sesi tanpa batas waktu, hanya dari Allowed IP" }
        password_expires_at:
          type: [string, "null"]
          format: date-time
          description: "Kedaluwarsa kata sandi (v0.3.7); null bila tidak kedaluwarsa (kebijakan 0 atau akun Viewer saja)"
        password_expired: { type: boolean, description: "Lewat masa berlaku → must_change_password true" }
        password_expires_soon: { type: boolean, description: "Dalam masa peringatan (password.warn_days)" }
    SessionInfo:
      type: object
      required: [id, created_at, last_seen_at, expires_at, idle_expires_at, ip, user_agent, current, mfa_verified]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "Batas absolut (session.absolute_hours sejak masuk, default 12 jam)" }
        idle_expires_at:
          type: string
          format: date-time
          description: |
            Batas idle (session.idle_minutes, default 30 menit). Sejak v0.3.7 hanya diperpanjang oleh aktivitas pengguna:
            `POST /api/v1/auth/activity` atau request tulis — request baca/polling tidak memperpanjangnya.
        ip: { type: [string, "null"], description: IP klien saat masuk }
        user_agent: { type: string, maxLength: 512 }
        current: { type: boolean, description: Sesi yang dipakai request ini }
        mfa_verified: { type: boolean, description: "false = mfa_pending (hanya me, logout, auth/mfa/*)" }
        kiosk: { type: boolean, description: Sesi kiosk (tanpa idle/absolut; dicabut bila dipakai dari luar Allowed IP) }
    AuthMe:
      type: object
      required: [user, session]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        session: { $ref: "#/components/schemas/SessionInfo" }
        regional: { $ref: "#/components/schemas/Regional" }
        server_time: { type: string, format: date-time, description: Jam server (hitung mundur sesi tidak bergantung jam klien) }
    Regional:
      type: object
      description: Pengaturan regional efektif (preferensi pengguna di atas nilai sistem). Data tetap UTC.
      required: [language, timezone, time_format, date_format]
      properties:
        language: { type: string, enum: [id, en] }
        timezone: { type: string, description: Nama zona IANA, example: Asia/Jakarta }
        time_format: { type: string, enum: [24h, 12h] }
        date_format: { type: string, enum: [DD/MM/YYYY, YYYY-MM-DD, DD MMM YYYY] }
    SettingItem:
      type: object
      required: [key, name, type, user_overridable, default, value, is_default, updated_at, updated_by]
      properties:
        key: { type: string, example: regional.timezone }
        name: { type: string, example: timezone, description: Nama di dalam grup (dipakai di body PUT) }
        type: { type: string, enum: [enum, string, int, bool] }
        enum: { type: array, items: { type: string } }
        min: { type: integer }
        max: { type: integer }
        max_length: { type: integer }
        user_overridable: { type: boolean, description: Boleh di-override per pengguna lewat /api/v1/me/preferences }
        managed: { type: boolean, description: Hanya bisa diubah lewat endpoint khususnya (mis. mode Allowed IP) }
        default: { description: Nilai bawaan (untuk regional language/timezone berasal dari konfigurasi server) }
        value: { description: Nilai efektif (sama dengan default bila belum pernah diubah) }
        is_default: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [string, "null"], format: uuid }
    AllowlistEntry:
      type: object
      required: [id, cidr, label, created_at, created_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        cidr: { type: string, example: 192.0.2.0/24 }
        label: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }
    AllowlistState:
      type: object
      required: [mode, pending_until, entries, your_ip, your_ip_in_list, always_public, confirm_window_seconds, server_time]
      properties:
        mode: { type: string, enum: [off, monitor, enforce] }
        pending_until: { type: [string, "null"], format: date-time, description: Batas konfirmasi enforce (auto-rollback) }
        entries: { type: array, items: { $ref: "#/components/schemas/AllowlistEntry" } }
        your_ip: { type: string, description: IP klien seperti dilihat server }
        your_ip_in_list: { type: boolean }
        always_public: { type: array, items: { type: string } }
        confirm_window_seconds: { type: integer, example: 120 }
        server_time: { type: string, format: date-time }
    SettingsGroup:
      type: object
      required: [group, items]
      properties:
        group: { type: string, example: regional }
        items: { type: array, items: { $ref: "#/components/schemas/SettingItem" } }
    SettingsUpdate:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          description: Nama → nilai baru, atau `null` untuk kembali ke default. Semua divalidasi sebelum ada yang ditulis.
          additionalProperties: true
          example: { timezone: Asia/Makassar, time_format: 12h }
    Preferences:
      type: object
      required: [preferences, effective, system, options]
      properties:
        preferences:
          type: object
          description: Key lengkap → nilai sendiri, atau `null` = ikuti sistem
          additionalProperties: true
          example: { regional.language: null, regional.timezone: UTC, regional.time_format: null, regional.date_format: null }
        effective: { $ref: "#/components/schemas/Regional" }
        system: { $ref: "#/components/schemas/Regional" }
        options:
          type: object
          description: Nilai yang diizinkan per key enum
          additionalProperties: { type: array, items: { type: string } }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    CheckResult:
      type: object
      required: [status, latency_ms]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        latency_ms: { type: integer, format: int64, minimum: 0 }
    Readiness:
      type: object
      required: [status, checks, checked_at]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CheckResult" }
          example:
            database: { status: ok, latency_ms: 1 }
            redis: { status: ok, latency_ms: 0 }
            migrations: { status: ok, latency_ms: 1 }
        checked_at: { type: string, format: date-time }
    PublicVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, example: v0.1.8 }
    Version:
      type: object
      required: [version, commit, go_version, server_time_utc, display_timezone, server_time_display]
      properties:
        version: { type: string, example: v0.1.8 }
        commit: { type: string, example: 1a2b3c4 }
        build_date: { type: string, format: date-time }
        go_version: { type: string, example: go1.27.2 }
        server_time_utc: { type: string, format: date-time }
        display_timezone: { type: string, example: Asia/Jakarta }
        server_time_display: { type: string, format: date-time, example: "2026-10-13T15:00:00+07:00" }
    UiBootstrap:
      type: object
      additionalProperties: false
      required: [app_name, version, default_locale, supported_locales, timezone, menu_groups, menus]
      properties:
        app_name: { type: string, example: Sentra DCIM }
        version: { type: string, example: v0.2.1, description: Sama dengan `/api/v1/version` publik }
        default_locale: { type: string, enum: [id, en], example: id }
        supported_locales:
          type: array
          items: { type: string, enum: [id, en] }
          example: [id, en]
        timezone: { type: string, description: Nama zona IANA untuk tampilan, example: Asia/Jakarta }
        menu_groups:
          type: array
          items: { $ref: "#/components/schemas/MenuGroup" }
        menus:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
    MenuGroup:
      type: object
      additionalProperties: false
      required: [key, order]
      properties:
        key:
          type: string
          enum: [monitoring, infrastructure, operations, system]
          description: "Kunci terjemahan `shell:groups.<key>`"
        order: { type: integer, example: 10 }
    MenuItem:
      type: object
      additionalProperties: false
      required: [key, path, icon, status, group, order, permission]
      properties:
        key: { type: string, description: "Kunci terjemahan `shell:sidebar.<key>`", example: dashboard }
        path: { type: string, example: / }
        icon: { type: string, description: Nama ikon lucide, example: layout-dashboard }
        status:
          type: string
          enum: [available, coming_soon, not_connected]
        group: { type: string, description: "`key` salah satu `menu_groups`", example: monitoring }
        order: { type: integer, description: Urutan di dalam grup, example: 10 }
        permission: { type: string, description: "Izin untuk melihat menu (kosong = semua pengguna yang masuk)", example: "" }
    HelpHeading:
      type: object
      additionalProperties: false
      required: [level, text]
      properties:
        level: { type: integer, enum: [2, 3] }
        text: { type: string, example: Langkah }
    HelpMeta:
      type: object
      required: [slug, title, audience, order, headings]
      properties:
        slug: { type: string, example: dashboard }
        title: { type: string, example: Dasbor }
        audience:
          type: string
          enum: [user, admin]
          description: Sasaran pembaca; dipakai menyaring per role mulai v0.3 (ISS-032)
        menu: { type: string, description: "Key registry menu; tombol \"?\" pada menu itu membuka halaman ini", example: dashboard }
        order: { type: integer, example: 30 }
        headings:
          type: array
          items: { $ref: "#/components/schemas/HelpHeading" }
    HelpIndex:
      type: object
      additionalProperties: false
      required: [locale, pages]
      properties:
        locale: { type: string, enum: [id, en] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/HelpMeta" }
    HelpPage:
      allOf:
        - $ref: "#/components/schemas/HelpMeta"
        - type: object
          required: [locale, markdown]
          properties:
            locale: { type: string, enum: [id, en] }
            markdown: { type: string, description: Isi Markdown (GFM) tanpa front matter }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
              description: |
                Kode stabil (diterjemahkan UI lewat `errors:code.<code>`), antara lain `not_found`, `forbidden`,
                `rate_limited`, `unauthenticated`, `invalid_credentials`, `csrf_failed`, `password_change_required`,
                `password_policy`, `invalid_current_password`, `invalid_request`, `auth_unavailable`,
                `validation_failed`, `username_taken`, `self_action`, `last_admin`, `mfa_required`, `invalid_mfa_code`,
                `mfa_already_enabled`, `mfa_not_enrolled`, `no_roles`; facility (v0.4.1): `duplicate_name`,
                `duplicate_code`, `duplicate_asset_tag`, `has_active_children`, `archived`, `parent_archived`,
                `cross_site_move`, `precondition_required`, `version_conflict`, `global_scope_required`, `out_of_scope`.
            message: { type: string, description: Pesan teknis berbahasa Inggris; jangan ditampilkan apa adanya }
            field: { type: string, description: "Field input yang tidak valid (validation_failed, username_taken)", example: email }
            request_id: { type: string }
    User:
      type: object
      required: [id, username, display_name, email, status, roles, must_change_password, locked, mfa_enabled, last_login_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, description: Tidak bisa diubah }
        display_name: { type: string }
        email: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        roles: { type: array, items: { type: string }, example: [technician] }
        must_change_password: { type: boolean }
        locked: { type: boolean, description: Sedang terkunci karena salah kata sandi atau kode MFA (lockout) }
        mfa_enabled: { type: boolean }
        kiosk: { type: boolean, description: "Akun monitoring/kiosk (v0.3.7)" }
        site_roles:
          type: array
          description: Role per site (v0.4.1, D-084); diisi pada detail pengguna, kosong pada daftar
          items: { $ref: "#/components/schemas/SiteRole" }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserList:
      type: object
      required: [users, total, limit, offset]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/User" } }
        total: { type: integer, description: Jumlah semua pengguna yang cocok }
        limit: { type: integer }
        offset: { type: integer }
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, display_name, roles]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9._-]{3,64}$", description: Nama pengguna atau NIP }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        email: { type: string, maxLength: 254, description: Opsional }
        roles: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string }, example: [technician] }
    UserProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        email: { type: string, maxLength: 254, description: String kosong menghapus e-mail }
    UserRoles:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string }
          description: Boleh kosong hanya bila pengguna punya role per-site (akses terbatas ke site itu saja)
    TemporaryPassword:
      type: object
      required: [temporary_password]
      properties:
        temporary_password: { type: string, format: password, pattern: "^[A-Za-z2-9]{4}(-[A-Za-z2-9]{4}){3}$", description: Ditampilkan sekali; tidak tersimpan selain sebagai hash }
    UserWithPassword:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: "#/components/schemas/User" }
        temporary_password: { type: string, format: password }
    Role:
      type: object
      required: [key, system, permissions, user_count]
      properties:
        key: { type: string, description: "Kunci terjemahan `users:roles.<key>`", example: auditor }
        system: { type: boolean }
        permissions: { type: array, items: { type: string }, example: [users.read, roles.read] }
        user_count: { type: integer }
    RoleList:
      type: object
      required: [roles, permissions]
      properties:
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        permissions: { type: array, items: { type: string }, description: Semua izin yang dikenal aplikasi }
    MfaStatus:
      type: object
      required: [enabled, enabled_at, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: [string, "null"], format: date-time }
        recovery_codes_remaining: { type: integer, minimum: 0, maximum: 10 }
    MfaEnrolment:
      type: object
      required: [issuer, account, secret, otpauth_uri, qr]
      properties:
        issuer: { type: string, example: Sentra DCIM }
        account: { type: string, example: admin.satu }
        secret: { type: string, description: "Secret base32 berkelompok 4 (entri manual); sekali tampil", example: "ABCD EFGH IJKL MNOP QRST UVWX YZ23 4567" }
        otpauth_uri: { type: string, description: "otpauth://totp/… (SHA1, 6 digit, 30 detik)" }
        qr:
          type: array
          items: { type: string, pattern: "^[01]+$" }
          description: Modul QR dari `otpauth_uri`, baris demi baris (`1` = gelap), tanpa quiet zone
    MfaCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, maxLength: 32, description: "Kode TOTP 6 digit, atau recovery code (hanya di verify)", example: "123456" }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, pattern: "^[a-z2-9]{5}-[a-z2-9]{5}$" }
