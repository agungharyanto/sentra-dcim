    put:
      tags: [users]
      operationId: setUserSiteRoles
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Ganti seluruh role per-site pengguna
      description: |
        Role yang berlaku **hanya untuk satu site** (D-084). Penugasan per-site hanya memberi izin data site
        (`facility.*`, `rack.*`) untuk site itu; izin global (pengguna, pengaturan, audit) hanya dari role global.
        Admin tidak bisa diberikan per site (`422`). Site harus ada dan aktif. Pengguna yang hanya boleh melihat
        site tertentu tidak boleh punya role global (role global berlaku di semua site). Akun harus tetap punya
        minimal satu role (global atau per-site) → `409 no_roles`. Dicatat `user.site_roles.update`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
