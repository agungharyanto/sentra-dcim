openapi: 3.1.0
info:
  title: Sentra DCIM API
  version: 0.3.3
  summary: REST API Sentra DCIM — Diskominfo Provinsi Bali
  description: |
    Semua endpoint berada di bawah `/api/v1`. Waktu dikirim dalam UTC (RFC 3339);
    zona tampilan diatur server lewat `DISPLAY_TIMEZONE` (default `Asia/Jakarta`, WIB, UTC+7).

    Setiap operasi memiliki ekstensi **`x-sentra-access`** yang menyatakan siapa yang dapat memanggilnya lewat domain
    publik: `public` (tanpa login), `login` (perlu sesi aplikasi; lewat domain publik juga basic_auth sementara sampai
    v0.3.4), `internal` (hanya listener internal server; ditolak `403` di edge). Viewer API di Pusat Bantuan
    menampilkan label dari nilai ini.

    **Autentikasi (sejak v0.3.1, ADR-003):** sesi server-side. `POST /api/v1/auth/login` memasang cookie
    `__Host-sentra_session` (HttpOnly, Secure, SameSite=Strict) dan `__Host-sentra_csrf`. Semua endpoint selain
    `health`, `version`, `auth/login` (dan `ready` di listener internal) **default-deny**: tanpa sesi → `401
    unauthenticated`. Metode yang mengubah data (POST/PUT/PATCH/DELETE) wajib membawa header `Origin` dari domain
    aplikasi dan header `X-Sentra-CSRF` yang sama dengan cookie `__Host-sentra_csrf` (sebelum login: nilai apa pun
    yang tidak kosong) → bila tidak, `403 csrf_failed`. Selama akun wajib ganti kata sandi, semua endpoint kecuali
    `auth/me`, `auth/password`, `auth/logout` menjawab `403 password_change_required`.

    **MFA (sejak v0.3.3, wajib untuk semua role):** setelah kata sandi benar sesi berstatus *mfa_pending*
    (`session.mfa_verified=false`): hanya `auth/me`, `auth/logout`, `auth/mfa`, `auth/mfa/enrol`,
    `auth/mfa/enrol/confirm`, `auth/mfa/verify` yang bisa dipakai; endpoint lain → `403 mfa_required`. Akun tanpa
    MFA aktif (`user.mfa_enabled=false`) melakukan enrolment (QR/kode manual + 1 kode), lainnya memasukkan kode TOTP
    (RFC 6238, 6 digit, 30 detik, ±1 langkah, kode yang sudah dipakai ditolak) atau recovery code. Kode salah →
    `401 invalid_mfa_code`, dihitung ke lockout yang sama dengan kata sandi (5 → 15 menit, semua sesi akun dicabut);
    rate limit per IP & per akun → `429`. Urutan: MFA dulu, lalu ganti kata sandi wajib.

    **Otorisasi (sejak v0.3.2, RBAC):** izin didefinisikan di kode, role di database. Operasi yang butuh izin
    memiliki ekstensi **`x-sentra-permission`**; tanpa izin itu jawabannya `403 forbidden` (dicatat di log audit
    sebagai `authz.denied`). Operasi tanpa ekstensi ini terbuka untuk semua pengguna yang masuk. Role sistem: Admin
    (semua izin), NOC, Security, Teknisi, Viewer, Auditor (`users.read`, `roles.read`). Role dibaca ulang setiap
    request, jadi perubahan role berlaku seketika.

    Setiap respons menyertakan header `X-Request-Id` untuk penelusuran. Error memakai format `ErrorBody`.
    Rate limit per IP klien (default 20 req/detik, burst 40) — respons `429` menyertakan `Retry-After`.
    Endpoint `GET` juga melayani `HEAD`.

    **Akses publik:** lewat `https://sentra.bajastu.id` hanya `/api/v1/health` dan `/api/v1/version` yang
    diteruskan tanpa autentikasi. `/api/v1/auth/*`, `/api/v1/ui/bootstrap`, `/api/v1/help/*` (dan UI web di `/`)
    juga dilindungi **basic_auth sementara** di proxy sampai v0.3.4 (ISS-026); permintaan API lain ditolak proxy
    dengan `403`. Listener internal server (`127.0.0.1:8080`, hanya dari server itu sendiri) menerapkan aturan sesi
    yang sama. Detail operasional `/api/v1/version` (commit, versi Go, waktu server) hanya dikirim ke sesi dengan
    izin `system.version.read` (Admin), di listener mana pun.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://sentra.bajastu.id
    description: Produksi (publik; hanya health & version)
  - url: http://127.0.0.1:8080
    description: Listener internal di server (API lengkap)
tags:
  - name: system
    description: Status layanan dan informasi build
  - name: ui
    description: Data pendukung UI web (bootstrap, registry menu)
  - name: help
    description: Pusat Bantuan — halaman Markdown (ID/EN) dan spesifikasi OpenAPI untuk viewer read-only
  - name: auth
    description: Masuk/keluar, sesi sendiri, ganti kata sandi (sesi server-side, ADR-003)
  - name: users
    description: Pengguna & Role — akun, penetapan role, nonaktifkan, reset kata sandi (RBAC, v0.3.2)
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      x-sentra-access: public
      summary: Liveness — proses berjalan
      description: Tidak memeriksa dependensi. Dipakai healthcheck container dan Caddy.
      security: []
      responses:
        "200":
          description: Proses hidup
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/ready:
    get:
      tags: [system]
      operationId: getReady
      x-sentra-access: internal
      summary: Readiness — dependensi siap
      description: |
        Memeriksa `database`, `redis`, dan `migrations` (versi skema DB sama dengan migrasi di binary).
        Detail error tidak dikirim ke klien (hanya ke log server).
      security: []
      responses:
        "200":
          description: Semua dependensi siap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Satu atau lebih dependensi tidak siap, atau server sedang shutdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      x-sentra-access: public
      summary: Versi aplikasi; detail build untuk Admin
      description: |
        `version` selalu sama dengan `git describe --tags --always --dirty` dari commit yang di-build
        (`make up` me-rebuild image dan memverifikasinya).

        - Tanpa sesi, atau sesi tanpa izin `system.version.read`: hanya `{"version": "..."}` (`PublicVersion`).
        - Sesi dengan izin `system.version.read` (Admin): `Version` lengkap — commit, tanggal build, versi Go, waktu
          server UTC dan zona tampilan. Sama di domain publik dan listener internal (D-054, v0.3.2). Cookie sesi
          yang tidak valid diabaikan (tidak pernah `401`).
      security: []
      responses:
        "200":
          description: Informasi versi (bentuk bergantung izin pemanggil)
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PublicVersion" }
                  - { $ref: "#/components/schemas/Version" }
              examples:
                public:
                  summary: Publik
                  value: { version: v0.1.8 }
                admin:
                  summary: Sesi Admin (system.version.read)
                  value:
                    version: v0.1.8
                    commit: 1a2b3c4
                    build_date: "2026-10-13T08:00:00Z"
                    go_version: go1.27.2
                    server_time_utc: "2026-10-13T08:00:00Z"
                    display_timezone: Asia/Jakarta
                    server_time_display: "2026-10-13T15:00:00+07:00"
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/ui/bootstrap:
    get:
      tags: [ui]
      operationId: getUiBootstrap
      x-sentra-access: login
      summary: Konfigurasi awal UI (bahasa, zona waktu, registry menu)
      description: |
        Dipanggil UI web saat start. `default_locale` dan `timezone` berasal dari konfigurasi server
        (`DEFAULT_LOCALE`, default `id`; `DISPLAY_TIMEZONE`, default `Asia/Jakarta`). Data tetap UTC; zona waktu
        hanya untuk tampilan.

        `menu_groups` (seksi sidebar, terurut `order`) dan `menus` adalah registry menu tunggal (backend). `menus`
        terurut menurut urutan grupnya lalu `order` di dalam grup. **Label tidak dikirim**: UI menerjemahkan
        `menu_groups[].key` lewat `shell:groups.<key>` dan `menus[].key` lewat `shell:sidebar.<key>`.

        **Breaking sejak v0.2.3:** field `menu_groups` dan `menus[].group` baru; path Dasbor `/` → `/dashboard`.

        Perlu sesi (sejak v0.3.1); lewat domain publik juga basic_auth sementara (sampai v0.3.4, ISS-026).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dokumen bootstrap UI
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UiBootstrap" }
              example:
                app_name: Sentra DCIM
                version: v0.3.2
                default_locale: id
                supported_locales: [id, en]
                timezone: Asia/Jakarta
                menu_groups:
                  - { key: monitoring, order: 10 }
                  - { key: system, order: 90 }
                menus:
                  - { key: dashboard, path: /dashboard, icon: layout-dashboard, status: available, group: monitoring, order: 10, permission: "" }
                  - { key: users, path: /users, icon: user-cog, status: available, group: system, order: 15, permission: users.read }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/help/index:
    get:
      tags: [help]
      operationId: getHelpIndex
      x-sentra-access: login
      summary: Daftar halaman Pusat Bantuan (tanpa isi)
      description: |
        Metadata semua halaman untuk satu bahasa, terurut `order` lalu `slug`, termasuk subjudul H2/H3 untuk
        pencarian di klien. Mulai v0.3 disaring menurut role pemanggil berdasarkan `audience` (ISS-032).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelpLocale"
      responses:
        "200":
          description: Indeks halaman
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpIndex" }
        "400": { $ref: "#/components/responses/InvalidLocale" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/HelpUnavailable" }
  /api/v1/help/pages/{slug}:
    get:
      tags: [help]
      operationId: getHelpPage
      x-sentra-access: login
      summary: Satu halaman Pusat Bantuan (Markdown)
      description: |
        `slug` boleh mengandung `/` (mis. `dashboard` atau `dashboard/extra`). Slug hanya dicocokkan dengan daftar
        halaman yang tervalidasi (whitelist), tidak pernah dipakai sebagai path file. Markdown tanpa front matter
        dan tanpa HTML mentah.
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*$", example: dashboard }
        - $ref: "#/components/parameters/HelpLocale"
      responses:
        "200":
          description: Halaman
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpPage" }
        "400": { $ref: "#/components/responses/InvalidLocale" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Halaman tidak ada untuk slug/bahasa ini
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/HelpUnavailable" }
  /api/v1/help/openapi:
    get:
      tags: [help]
      operationId: getHelpOpenAPI
      x-sentra-access: login
      summary: Spesifikasi OpenAPI ini dalam JSON (untuk viewer read-only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dokumen OpenAPI 3.1
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/HelpUnavailable" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      x-sentra-access: login
      summary: Masuk dengan nama pengguna (atau NIP) dan kata sandi
      description: |
        Tidak memerlukan sesi (lewat domain publik masih di balik basic_auth sementara sampai v0.3.4). Wajib header
        `Origin` dari domain aplikasi dan `X-Sentra-CSRF` (nilai apa pun yang tidak kosong).

        Berhasil → sesi baru (sesi lama di browser ini dicabut, *rotation*), cookie `__Host-sentra_session`
        (HttpOnly) dan `__Host-sentra_csrf` (dibaca UI untuk header `X-Sentra-CSRF`). Kedua cookie berlaku selama
        browser terbuka; server mengakhiri sesi setelah 30 menit tanpa aktivitas atau 12 jam sejak masuk.

        Gagal → selalu `401 invalid_credentials` yang sama untuk pengguna tidak dikenal, kata sandi salah, akun
        terkunci (5 kali salah → 15 menit) atau nonaktif. Percobaan dibatasi per IP dan per nama pengguna → `429`
        dengan `Retry-After`. Setiap percobaan dicatat di audit log (tanpa kata sandi).
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Berhasil masuk
          headers:
            Set-Cookie:
              description: "`__Host-sentra_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` dan `__Host-sentra_csrf=…; Path=/; Secure; SameSite=Strict`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: Nama pengguna atau kata sandi salah (generik; juga untuk akun terkunci/nonaktif) — `invalid_credentials`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-sentra-access: login
      summary: Keluar — mencabut sesi ini dan menghapus cookie
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Sesi dicabut }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      x-sentra-access: login
      summary: Pengguna yang sedang masuk dan sesi ini
      description: Tetap dapat dipanggil selama akun wajib ganti kata sandi (`user.must_change_password`).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pengguna dan sesi aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      x-sentra-access: login
      summary: Ganti kata sandi sendiri
      description: |
        Kata sandi baru 12–128 karakter (tanpa aturan komposisi), berbeda dari yang sekarang. Berhasil → semua sesi
        lain akun ini dicabut, sesi ini tetap aktif, dan `must_change_password` dihapus.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: "Kata sandi diganti; sesi lain dicabut" }
        "400":
          description: Kata sandi saat ini salah (`invalid_current_password`) atau body tidak valid (`invalid_request`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Kata sandi baru tidak memenuhi ketentuan (`password_policy`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordPolicyError" }
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      x-sentra-access: login
      summary: Sesi aktif milik sendiri
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Daftar sesi aktif (terbaru dulu); `current` menandai sesi ini
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      x-sentra-access: login
      summary: Cabut salah satu sesi sendiri
      description: Hanya sesi milik pengguna sendiri; ID sesi pengguna lain dijawab `404` (tidak membocorkan keberadaannya).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: "Sesi dicabut (bila sesi ini, cookie juga dihapus)" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      x-sentra-access: login
      x-sentra-permission: users.read
      summary: Daftar pengguna (cari, filter, halaman)
      description: Urut nama pengguna. `q` dicari literal (tanpa wildcard) di nama pengguna dan nama tampilan.
      security:
        - sessionCookie: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: role, in: query, schema: { type: string, example: admin } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Satu halaman pengguna dan jumlah total yang cocok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [users]
      operationId: createUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Buat pengguna dengan kata sandi sementara
      description: |
        Server membuat kata sandi sementara acak (`xxxx-xxxx-xxxx-xxxx`) yang dikirim **sekali** di respons ini
        (`Cache-Control: no-store`), tidak pernah dicatat. Pengguna wajib menggantinya saat login pertama.
        Nama pengguna tidak bisa diubah setelah dibuat.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Pengguna dibuat
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithPassword" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      x-sentra-access: login
      x-sentra-permission: users.read
      summary: Detail pengguna
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pengguna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Ubah nama tampilan dan/atau e-mail
      description: Field yang tidak dikirim tidak berubah; `email` kosong menghapus e-mail.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: setUserRoles
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Ganti seluruh role pengguna
      description: |
        Minimal satu role. Berlaku seketika. Ditolak `409 self_action` bila mencabut role Admin sendiri, `409
        last_admin` bila mencabut role Admin dari Admin aktif terakhir.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoles" }
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: disableUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Nonaktifkan pengguna (semua sesinya dicabut)
      description: Idempoten. Ditolak `409 self_action` untuk akun sendiri dan `409 last_admin` untuk Admin aktif terakhir.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: enableUser
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Aktifkan kembali pengguna
      description: Idempoten. Kata sandi tidak berubah.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: resetUserPassword
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Atur ulang kata sandi (kata sandi sementara baru)
      description: |
        Kata sandi sementara baru dikirim **sekali** (`Cache-Control: no-store`), wajib diganti saat login, lockout
        dibuka, semua sesi pengguna dicabut. Tidak untuk akun sendiri (`409 self_action`; pakai `auth/password`).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Kata sandi sementara
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPassword" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/mfa:
    get:
      tags: [auth]
      operationId: getMfaStatus
      x-sentra-access: login
      summary: Status MFA akun sendiri
      description: Dapat dipanggil saat sesi *mfa_pending*.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Status MFA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/mfa/enrol:
    post:
      tags: [auth]
      operationId: startMfaEnrolment
      x-sentra-access: login
      summary: Mulai enrolment MFA (secret baru, QR, kode manual)
      description: |
        Hanya untuk akun tanpa MFA aktif. Memanggil ulang mengganti secret yang belum dikonfirmasi. Respons memuat
        secret satu kali (`Cache-Control: no-store`); jangan disimpan klien.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Data enrolment
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrolment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
  /api/v1/auth/mfa/enrol/confirm:
    post:
      tags: [auth]
      operationId: confirmMfaEnrolment
      x-sentra-access: login
      summary: Aktifkan MFA dengan kode pertama; sesi ini lolos MFA
      description: "Mengembalikan 10 recovery code sekali pakai — **sekali saja** (`Cache-Control: no-store`)."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: MFA aktif
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidMfaCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      x-sentra-access: login
      summary: Selesaikan login dengan kode TOTP atau recovery code
      description: Recovery code (`xxxxx-xxxxx`, huruf besar/kecil & spasi diabaikan) hanya berlaku sekali.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "204": { description: Sesi lolos MFA }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidMfaCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/mfa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      x-sentra-access: login
      summary: Buat ulang 10 recovery code (kode lama tidak berlaku)
      description: Butuh kode TOTP saat ini (autentikasi ulang). Kode baru tampil sekali.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: Recovery code baru
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/InvalidMfaCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MfaConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/users/{id}/mfa-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: resetUserMfa
      x-sentra-access: login
      x-sentra-permission: users.manage
      summary: Reset MFA pengguna lain (enrol ulang saat login berikutnya)
      description: "Menghapus MFA & recovery code dan mencabut semua sesi pengguna. Tidak untuk akun sendiri (`409 self_action`)."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: MFA direset }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/roles:
    get:
      tags: [users]
      operationId: listRoles
      x-sentra-access: login
      x-sentra-permission: roles.read
      summary: Daftar role, izinnya, dan jumlah pengguna
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Role sistem (urutan tampilan) dan semua izin yang dikenal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    HelpLocale:
      name: locale
      in: query
      required: false
      description: Bahasa halaman; default `DEFAULT_LOCALE` server
      schema: { type: string, enum: [id, en] }
    CsrfHeader:
      name: X-Sentra-CSRF
      in: header
      required: true
      description: Token CSRF = nilai cookie `__Host-sentra_csrf` (sebelum login nilai apa pun yang tidak kosong)
      schema: { type: string }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sentra_session
      description: |
        Sesi server-side (token acak 256-bit; server hanya menyimpan SHA-256-nya). Dipasang oleh `POST /api/v1/auth/login`.
        Idle 30 menit, absolut 12 jam. Metode yang mengubah data juga butuh `Origin` + `X-Sentra-CSRF`.
        Lewat domain publik proxy masih meminta basic_auth sementara di depan UI, `auth/*`, `ui/*`, `help/*`
        sampai v0.3.4 (ISS-026, D-043); itu bukan bagian dari API aplikasi.
  headers:
    X-Request-Id:
      description: ID unik request untuk penelusuran log
      schema: { type: string }
  responses:
    Unauthenticated:
      description: |
        Tanpa sesi yang valid (`unauthenticated`): cookie tidak ada, sesi kedaluwarsa (idle/absolut), dicabut, atau
        akun dinonaktifkan. Lewat domain publik proxy juga dapat menjawab 401 bila basic_auth sementara salah.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: |
        `csrf_failed` (Origin bukan domain aplikasi / header `X-Sentra-CSRF` tidak ada atau tidak cocok),
        `password_change_required` (akun wajib ganti kata sandi dulu), `mfa_required` (sesi belum lolos MFA), atau `forbidden` (tanpa izin yang
        disyaratkan `x-sentra-permission`, atau ditolak proxy).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Data tidak ditemukan (`not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: |
        `username_taken` (nama pengguna sudah ada, tidak peka huruf besar/kecil), `self_action` (aksi tidak boleh
        pada akun sendiri), atau `last_admin` (Admin aktif terakhir tidak boleh kehilangan akses)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    InvalidMfaCode:
      description: Kode MFA atau recovery code salah, sudah dipakai, atau akun terkunci (`invalid_mfa_code`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    MfaConflict:
      description: "`mfa_already_enabled` (enrolment saat MFA sudah aktif) atau `mfa_not_enrolled` (belum ada MFA)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ValidationFailed:
      description: Input tidak valid (`validation_failed`); `error.field` menyebut field-nya
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    InvalidRequest:
      description: Body JSON tidak valid atau berisi field tak dikenal (`invalid_request`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    AuthUnavailable:
      description: Layanan login sementara tidak tersedia, mis. Redis rate limiter mati — gagal tertutup (`auth_unavailable`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    InvalidLocale:
      description: Parameter `locale` tidak didukung (`invalid_locale`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    HelpUnavailable:
      description: Konten Pusat Bantuan gagal validasi saat startup; hanya modul help yang nonaktif (`help_unavailable`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    TooManyRequests:
      description: Rate limit terlampaui
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9._-]{3,64}$", description: Nama pengguna atau NIP (tidak peka huruf besar/kecil) }
        password: { type: string, format: password, minLength: 1 }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12, maxLength: 128, description: "12–128 karakter Unicode, tanpa aturan komposisi" }
    PasswordPolicyError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, min_length, max_length]
          properties:
            code: { type: string, enum: [password_policy] }
            message: { type: string }
            min_length: { type: integer, example: 12 }
            max_length: { type: integer, example: 128 }
    AuthUser:
      type: object
      required: [id, username, display_name, must_change_password, roles, permissions, mfa_enabled]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        must_change_password: { type: boolean, description: "Bila true, hanya auth/me, auth/password, auth/logout yang dapat dipakai" }
        roles: { type: array, items: { type: string }, example: [admin] }
        permissions:
          type: array
          items: { type: string }
          description: Gabungan izin semua role (UI menyembunyikan menu tanpa izin; API tetap memeriksa)
          example: [roles.read, system.version.read, users.manage, users.read]
        mfa_enabled: { type: boolean, description: "MFA aktif; false → enrolment saat login" }
    SessionInfo:
      type: object
      required: [id, created_at, last_seen_at, expires_at, idle_expires_at, ip, user_agent, current, mfa_verified]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Batas absolut (12 jam sejak masuk) }
        idle_expires_at: { type: string, format: date-time, description: "Batas idle (30 menit sejak aktivitas terakhir, diperbarui paling sering 1×/menit)" }
        ip: { type: [string, "null"], description: IP klien saat masuk }
        user_agent: { type: string, maxLength: 512 }
        current: { type: boolean, description: Sesi yang dipakai request ini }
        mfa_verified: { type: boolean, description: "false = mfa_pending (hanya me, logout, auth/mfa/*)" }
    AuthMe:
      type: object
      required: [user, session]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        session: { $ref: "#/components/schemas/SessionInfo" }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    CheckResult:
      type: object
      required: [status, latency_ms]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        latency_ms: { type: integer, format: int64, minimum: 0 }
    Readiness:
      type: object
      required: [status, checks, checked_at]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CheckResult" }
          example:
            database: { status: ok, latency_ms: 1 }
            redis: { status: ok, latency_ms: 0 }
            migrations: { status: ok, latency_ms: 1 }
        checked_at: { type: string, format: date-time }
    PublicVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, example: v0.1.8 }
    Version:
      type: object
      required: [version, commit, go_version, server_time_utc, display_timezone, server_time_display]
      properties:
        version: { type: string, example: v0.1.8 }
        commit: { type: string, example: 1a2b3c4 }
        build_date: { type: string, format: date-time }
        go_version: { type: string, example: go1.27.2 }
        server_time_utc: { type: string, format: date-time }
        display_timezone: { type: string, example: Asia/Jakarta }
        server_time_display: { type: string, format: date-time, example: "2026-10-13T15:00:00+07:00" }
    UiBootstrap:
      type: object
      additionalProperties: false
      required: [app_name, version, default_locale, supported_locales, timezone, menu_groups, menus]
      properties:
        app_name: { type: string, example: Sentra DCIM }
        version: { type: string, example: v0.2.1, description: Sama dengan `/api/v1/version` publik }
        default_locale: { type: string, enum: [id, en], example: id }
        supported_locales:
          type: array
          items: { type: string, enum: [id, en] }
          example: [id, en]
        timezone: { type: string, description: Nama zona IANA untuk tampilan, example: Asia/Jakarta }
        menu_groups:
          type: array
          items: { $ref: "#/components/schemas/MenuGroup" }
        menus:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
    MenuGroup:
      type: object
      additionalProperties: false
      required: [key, order]
      properties:
        key:
          type: string
          enum: [monitoring, infrastructure, operations, system]
          description: "Kunci terjemahan `shell:groups.<key>`"
        order: { type: integer, example: 10 }
    MenuItem:
      type: object
      additionalProperties: false
      required: [key, path, icon, status, group, order, permission]
      properties:
        key: { type: string, description: "Kunci terjemahan `shell:sidebar.<key>`", example: dashboard }
        path: { type: string, example: / }
        icon: { type: string, description: Nama ikon lucide, example: layout-dashboard }
        status:
          type: string
          enum: [available, coming_soon, not_connected]
        group: { type: string, description: "`key` salah satu `menu_groups`", example: monitoring }
        order: { type: integer, description: Urutan di dalam grup, example: 10 }
        permission: { type: string, description: "Izin untuk melihat menu (kosong = semua pengguna yang masuk)", example: "" }
    HelpHeading:
      type: object
      additionalProperties: false
      required: [level, text]
      properties:
        level: { type: integer, enum: [2, 3] }
        text: { type: string, example: Langkah }
    HelpMeta:
      type: object
      required: [slug, title, audience, order, headings]
      properties:
        slug: { type: string, example: dashboard }
        title: { type: string, example: Dasbor }
        audience:
          type: string
          enum: [user, admin]
          description: Sasaran pembaca; dipakai menyaring per role mulai v0.3 (ISS-032)
        menu: { type: string, description: "Key registry menu; tombol \"?\" pada menu itu membuka halaman ini", example: dashboard }
        order: { type: integer, example: 30 }
        headings:
          type: array
          items: { $ref: "#/components/schemas/HelpHeading" }
    HelpIndex:
      type: object
      additionalProperties: false
      required: [locale, pages]
      properties:
        locale: { type: string, enum: [id, en] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/HelpMeta" }
    HelpPage:
      allOf:
        - $ref: "#/components/schemas/HelpMeta"
        - type: object
          required: [locale, markdown]
          properties:
            locale: { type: string, enum: [id, en] }
            markdown: { type: string, description: Isi Markdown (GFM) tanpa front matter }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
              description: |
                Kode stabil (diterjemahkan UI lewat `errors:code.<code>`), antara lain `not_found`, `forbidden`,
                `rate_limited`, `unauthenticated`, `invalid_credentials`, `csrf_failed`, `password_change_required`,
                `password_policy`, `invalid_current_password`, `invalid_request`, `auth_unavailable`,
                `validation_failed`, `username_taken`, `self_action`, `last_admin`, `mfa_required`, `invalid_mfa_code`,
                `mfa_already_enabled`, `mfa_not_enrolled`.
            message: { type: string, description: Pesan teknis berbahasa Inggris; jangan ditampilkan apa adanya }
            field: { type: string, description: "Field input yang tidak valid (validation_failed, username_taken)", example: email }
            request_id: { type: string }
    User:
      type: object
      required: [id, username, display_name, email, status, roles, must_change_password, locked, mfa_enabled, last_login_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, description: Tidak bisa diubah }
        display_name: { type: string }
        email: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        roles: { type: array, items: { type: string }, example: [technician] }
        must_change_password: { type: boolean }
        locked: { type: boolean, description: Sedang terkunci karena salah kata sandi atau kode MFA (lockout) }
        mfa_enabled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserList:
      type: object
      required: [users, total, limit, offset]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/User" } }
        total: { type: integer, description: Jumlah semua pengguna yang cocok }
        limit: { type: integer }
        offset: { type: integer }
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, display_name, roles]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9._-]{3,64}$", description: Nama pengguna atau NIP }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        email: { type: string, maxLength: 254, description: Opsional }
        roles: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string }, example: [technician] }
    UserProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        email: { type: string, maxLength: 254, description: String kosong menghapus e-mail }
    UserRoles:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string } }
    TemporaryPassword:
      type: object
      required: [temporary_password]
      properties:
        temporary_password: { type: string, format: password, pattern: "^[A-Za-z2-9]{4}(-[A-Za-z2-9]{4}){3}$", description: Ditampilkan sekali; tidak tersimpan selain sebagai hash }
    UserWithPassword:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: "#/components/schemas/User" }
        temporary_password: { type: string, format: password }
    Role:
      type: object
      required: [key, system, permissions, user_count]
      properties:
        key: { type: string, description: "Kunci terjemahan `users:roles.<key>`", example: auditor }
        system: { type: boolean }
        permissions: { type: array, items: { type: string }, example: [users.read, roles.read] }
        user_count: { type: integer }
    RoleList:
      type: object
      required: [roles, permissions]
      properties:
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        permissions: { type: array, items: { type: string }, description: Semua izin yang dikenal aplikasi }
    MfaStatus:
      type: object
      required: [enabled, enabled_at, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: [string, "null"], format: date-time }
        recovery_codes_remaining: { type: integer, minimum: 0, maximum: 10 }
    MfaEnrolment:
      type: object
      required: [issuer, account, secret, otpauth_uri, qr]
      properties:
        issuer: { type: string, example: Sentra DCIM }
        account: { type: string, example: admin.satu }
        secret: { type: string, description: "Secret base32 berkelompok 4 (entri manual); sekali tampil", example: "ABCD EFGH IJKL MNOP QRST UVWX YZ23 4567" }
        otpauth_uri: { type: string, description: "otpauth://totp/… (SHA1, 6 digit, 30 detik)" }
        qr:
          type: array
          items: { type: string, pattern: "^[01]+$" }
          description: Modul QR dari `otpauth_uri`, baris demi baris (`1` = gelap), tanpa quiet zone
    MfaCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, maxLength: 32, description: "Kode TOTP 6 digit, atau recovery code (hanya di verify)", example: "123456" }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, pattern: "^[a-z2-9]{5}-[a-z2-9]{5}$" }
