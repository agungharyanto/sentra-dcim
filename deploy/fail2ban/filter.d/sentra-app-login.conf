# Sentra DCIM — failed application sign-ins in the Caddy JSON access log (v0.3.3, D-066; replaces the basic_auth
# filter of ISS-026).
#
# Counts ONLY: POST to the login or an MFA-code endpoint + status 401 (wrong password, unknown user, wrong/used MFA
# code — the app answers all of them with 401) + our public host. Not counted: a 401 of GET /auth/me (normal
# "not signed in"), 403 CSRF refusals, 429 rate limits (the app already throttles), successful sign-ins.
#
# Every condition is a lookahead, so the order of JSON keys does not matter. Attacker-controlled values (headers,
# query) are JSON-escaped by Caddy (\"), so they can never forge `"status":401`, `"method":"POST"`, `"uri":"…"` or
# `"client_ip":"…"`.

[INCLUDES]
before = common.conf

[Init]
# Regex-escaped public host; the installer passes it from DOMAIN in .env (filter = sentra-app-login[sentra_host=…]).
sentra_host = sentra\.example\.go\.id

[Definition]
failregex = ^(?=.*"status":\s*401[,}])(?=.*"method":\s*"POST")(?=.*"uri":\s*"/api/v1/auth/(?:login|mfa/verify|mfa/enrol/confirm|mfa/recovery-codes)(?:\?[^"]*)?")(?=.*"host":\s*"%(sentra_host)s(?::\d+)?")(?=.*"client_ip":\s*"<ADDR>")

ignoreregex =

# Caddy writes the Unix timestamp with sub-second precision: "ts":1791905931.6194942
datepattern = "ts":\s*{EPOCH}
